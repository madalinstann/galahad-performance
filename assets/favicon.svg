<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favTitanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#A3E635" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#08090C"/>
  <!-- Litera G minimalistă conform fontului brandului -->
  <path d="M 66 32 L 44 32 C 34 32 28 38 28 50 C 28 62 34 68 44 68 L 68 68 L 68 50 L 50 50 L 50 56 L 60 56 L 60 62 L 44 62 C 38 62 36 58 36 50 C 36 42 38 38 44 38 L 66 38 Z" fill="url(#favTitanium)"/>
  <!-- Punct verde toxic neon (identic cu cel din logo-ul original) -->
  <circle cx="75" cy="28" r="5" fill="#A3E635" filter="url(#favGlow)"/>
  <!-- Linie viteză toxic green -->
  <rect x="28" y="76" width="44" height="4" rx="2" fill="#A3E635" filter="url(#favGlow)"/>
</svg>
