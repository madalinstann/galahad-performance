<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="460" height="80" fill="none">
  <defs>
    <linearGradient id="logoTitanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#A3E635" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- GALAHAD -->
  <text x="0" y="38" font-family="'Syncopate', sans-serif" font-size="36" font-weight="700" letter-spacing="0.2em" fill="url(#logoTitanium)">GALAHAD</text>
  <circle cx="345" cy="24" r="5" fill="#A3E635" filter="url(#logoGlow)"/>
  <!-- Toxic Green Speedline -->
  <rect x="0" y="48" width="60" height="3" rx="1.5" fill="#A3E635" filter="url(#logoGlow)"/>
  <!-- PERFORMANCE -->
  <text x="75" y="55" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" letter-spacing="0.45em" fill="#A3E635">PERFORMANCE</text>
</svg>
