<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <defs>
    <linearGradient id="titaniumGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="laserLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#A3E635" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#A3E635"/>
      <stop offset="80%" stop-color="#A3E635" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="toxicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#A3E635" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Crest / Shield Icon (Stânga) -->
  <g transform="translate(15, 10)">
    <!-- Scut exterior -->
    <path d="M 50 5 L 85 20 L 78 70 L 50 95 L 22 70 L 15 20 Z" fill="#0D1016" stroke="url(#titaniumGlow)" stroke-width="3"/>
    <!-- Scut interior -->
    <path d="M 50 14 L 75 25 L 70 65 L 50 85 L 30 65 L 25 25 Z" fill="#131720"/>
    <!-- G aerodinamic sculptat -->
    <path d="M 62 30 L 42 30 L 32 45 L 32 60 L 42 72 L 65 72 L 65 52 L 48 52 L 48 58 L 56 58 L 56 64 L 44 64 L 39 58 L 39 48 L 44 38 L 58 38 L 65 30 Z" fill="url(#titaniumGlow)"/>
    <!-- Accent Toxic Green în unghiul de viteză -->
    <polygon points="56,30 66,30 66,40" fill="#A3E635" filter="url(#toxicGlow)"/>
    <path d="M 32 62 L 50 80 L 68 62" stroke="#A3E635" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Typography GALAHAD PERFORMANCE (Dreapta) -->
  <g transform="translate(130, 20)">
    <!-- GALAHAD -->
    <text x="0" y="42" font-family="'Syncopate', sans-serif" font-size="36" font-weight="700" letter-spacing="0.2em" fill="url(#titaniumGlow)">GALAHAD</text>
    <!-- Laser Line -->
    <rect x="0" y="52" width="340" height="3" rx="1.5" fill="url(#laserLine)" filter="url(#toxicGlow)"/>
    <!-- PERFORMANCE -->
    <text x="5" y="74" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" letter-spacing="0.52em" fill="#A3E635">PERFORMANCE</text>
  </g>
</svg>
